<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <linearGradient id="monoLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>

  <!-- Architectural Geometric 'S' Monogram (Black & White Minimalist) -->
  <g transform="translate(6, 6)">
    <!-- Top Beam Segment -->
    <path d="M4 14 L28 14 L42 2 L18 2 Z" fill="url(#monoGrad)" />
    <!-- Upper Vertical Angle Segment -->
    <path d="M4 14 L18 2 L18 22 L4 34 Z" fill="url(#monoLight)" />
    <!-- Central Cross Beam -->
    <path d="M4 34 L18 22 L44 22 L30 34 Z" fill="url(#monoGrad)" />
    <!-- Lower Vertical Angle Segment -->
    <path d="M30 34 L44 22 L44 42 L30 54 Z" fill="url(#monoLight)" />
    <!-- Bottom Beam Segment -->
    <path d="M6 54 L30 54 L44 42 L20 42 Z" fill="url(#monoGrad)" />
    <!-- Accent Dot -->
    <circle cx="42" cy="14" r="3" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(66, 10)">
    <!-- Main Brand Name -->
    <text x="0" y="30" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">STRATUM</text>
    <!-- Subtitle / Disciplines -->
    <text x="1" y="47" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="8.5" font-weight="600" letter-spacing="2.8" fill="#A1A1AA">VDC | BIM | MEP ENGINEERING</text>
  </g>
</svg>