<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(196, 139, 94, 0.08)" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(196, 139, 94, 0.2)" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(196, 139, 94, 0.18)" stroke-width="1.2" />
    </pattern>
    <linearGradient id="ductSupply" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="ductReturn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="copperRays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C48B5E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9E6940" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1600" height="900" fill="#110F0E" />
  <rect width="1600" height="900" fill="url(#majorGrid)" />

  <!-- Architectural Building Structural Columns & Grid (IS 456 Structural Grid) -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="6,4">
    <!-- Gridlines X (1 to 8) -->
    <line x1="200" y1="60" x2="200" y2="840" />
    <line x1="400" y1="60" x2="400" y2="840" />
    <line x1="600" y1="60" x2="600" y2="840" />
    <line x1="800" y1="60" x2="800" y2="840" />
    <line x1="1000" y1="60" x2="1000" y2="840" />
    <line x1="1200" y1="60" x2="1200" y2="840" />
    <line x1="1400" y1="60" x2="1400" y2="840" />

    <!-- Gridlines Y (A to E) -->
    <line x1="100" y1="160" x2="1500" y2="160" />
    <line x1="100" y1="340" x2="1500" y2="340" />
    <line x1="100" y1="520" x2="1500" y2="520" />
    <line x1="100" y1="700" x2="1500" y2="700" />
  </g>

  <!-- Concrete Structural Columns -->
  <g fill="#181513" stroke="rgba(196, 139, 94, 0.4)" stroke-width="1.5">
    <rect x="185" y="145" width="30" height="30" />
    <rect x="385" y="145" width="30" height="30" />
    <rect x="585" y="145" width="30" height="30" />
    <rect x="785" y="145" width="30" height="30" />
    <rect x="985" y="145" width="30" height="30" />
    <rect x="1185" y="145" width="30" height="30" />
    <rect x="1385" y="145" width="30" height="30" />

    <rect x="185" y="325" width="30" height="30" />
    <rect x="385" y="325" width="30" height="30" />
    <rect x="585" y="325" width="30" height="30" />
    <rect x="785" y="325" width="30" height="30" />
    <rect x="985" y="325" width="30" height="30" />
    <rect x="1185" y="325" width="30" height="30" />
    <rect x="1385" y="325" width="30" height="30" />

    <rect x="185" y="505" width="30" height="30" />
    <rect x="385" y="505" width="30" height="30" />
    <rect x="585" y="505" width="30" height="30" />
    <rect x="785" y="505" width="30" height="30" />
    <rect x="985" y="505" width="30" height="30" />
    <rect x="1185" y="505" width="30" height="30" />
    <rect x="1385" y="505" width="30" height="30" />
  </g>

  <!-- HVAC Main Supply Air Ductwork (Cyan Routing) -->
  <g>
    <!-- Main Chilled Air Header -->
    <path d="M 120 220 L 750 220 L 750 420 L 1450 420" fill="none" stroke="#38BDF8" stroke-width="26" stroke-linecap="square" opacity="0.35" />
    <path d="M 120 220 L 750 220 L 750 420 L 1450 420" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="square" opacity="0.8" />
    
    <!-- Duct Centerline -->
    <path d="M 120 220 L 750 220 L 750 420 L 1450 420" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="10,4,2,4" opacity="0.6" />

    <!-- Supply Air Branch Takeoffs & Diffusers -->
    <g stroke="#38BDF8" stroke-width="14" opacity="0.4">
      <line x1="280" y1="220" x2="280" y2="120" />
      <line x1="480" y1="220" x2="480" y2="120" />
      <line x1="680" y1="220" x2="680" y2="120" />
      <line x1="900" y1="420" x2="900" y2="300" />
      <line x1="1100" y1="420" x2="1100" y2="300" />
      <line x1="1300" y1="420" x2="1300" y2="300" />
      <line x1="900" y1="420" x2="900" y2="540" />
      <line x1="1100" y1="420" x2="1100" y2="540" />
      <line x1="1300" y1="420" x2="1300" y2="540" />
    </g>

    <!-- Air Diffusers (4-way square diffusers) -->
    <g fill="#181513" stroke="#38BDF8" stroke-width="1.5">
      <rect x="265" y="105" width="30" height="30" />
      <line x1="265" y1="105" x2="295" y2="135" />
      <line x1="295" y1="105" x2="265" y2="135" />

      <rect x="465" y="105" width="30" height="30" />
      <line x1="465" y1="105" x2="495" y2="135" />
      <line x1="495" y1="105" x2="465" y2="135" />

      <rect x="665" y="105" width="30" height="30" />
      <line x1="665" y1="105" x2="695" y2="135" />
      <line x1="695" y1="105" x2="665" y2="135" />

      <rect x="885" y="285" width="30" height="30" />
      <line x1="885" y1="285" x2="915" y2="315" />
      <line x1="915" y1="285" x2="885" y2="315" />

      <rect x="1085" y="285" width="30" height="30" />
      <line x1="1085" y1="285" x2="1115" y2="315" />
      <line x1="1115" y1="285" x2="1085" y2="315" />

      <rect x="1285" y="285" width="30" height="30" />
      <line x1="1285" y1="285" x2="1315" y2="315" />
      <line x1="1315" y1="285" x2="1285" y2="315" />
    </g>
  </g>

  <!-- Fire Fighting Sprinkler Main & Heads (NFPA Red) -->
  <g>
    <!-- Sprinkler Main Loop -->
    <path d="M 100 270 L 1480 270 L 1480 640 L 100 640 Z" fill="none" stroke="#EF4444" stroke-width="3" opacity="0.6" />
    
    <!-- Sprinkler Branch Lines -->
    <path d="M 300 270 L 300 640 M 500 270 L 500 640 M 700 270 L 700 640 M 900 270 L 900 640 M 1100 270 L 1100 640 M 1300 270 L 1300 640" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />

    <!-- Pendant Sprinkler Heads with Throw Radii -->
    <g fill="#EF4444" opacity="0.7">
      <circle cx="300" cy="370" r="4" />
      <circle cx="500" cy="370" r="4" />
      <circle cx="700" cy="370" r="4" />
      <circle cx="900" cy="370" r="4" />
      <circle cx="1100" cy="370" r="4" />
      <circle cx="1300" cy="370" r="4" />

      <circle cx="300" cy="540" r="4" />
      <circle cx="500" cy="540" r="4" />
      <circle cx="700" cy="540" r="4" />
      <circle cx="900" cy="540" r="4" />
      <circle cx="1100" cy="540" r="4" />
      <circle cx="1300" cy="540" r="4" />
    </g>
  </g>

  <!-- Electrical Cable Tray & Busduct (Amber Yellow) -->
  <g>
    <path d="M 140 180 L 1420 180 L 1420 480" fill="none" stroke="#F59E0B" stroke-width="5" opacity="0.5" stroke-dasharray="12,4" />
    <path d="M 140 600 L 1420 600" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.4" stroke-dasharray="8,4" />
  </g>

  <!-- Technical Engineering Callouts & Dimensional Markers -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#C48B5E" letter-spacing="1">
    <!-- Elevation Markers -->
    <text x="320" y="245">B.O.D. +3450mm [1200x450mm SA DUCT]</text>
    <text x="820" y="445">B.O.D. +3300mm [800x400mm SA DUCT]</text>
    <text x="310" y="290" fill="#EF4444">T.O.P. +3750mm [100mm DIA WET SPRINKLER MAIN]</text>
    <text x="320" y="172" fill="#F59E0B">T.O.T. +3900mm [600mm CABLE TRAY // 415V BUSDUCT]</text>
    
    <!-- Coordinates -->
    <text x="195" y="865" fill="#9E968F">GRID-1</text>
    <text x="395" y="865" fill="#9E968F">GRID-2</text>
    <text x="595" y="865" fill="#9E968F">GRID-3</text>
    <text x="795" y="865" fill="#9E968F">GRID-4</text>
    <text x="995" y="865" fill="#9E968F">GRID-5</text>
    <text x="1195" y="865" fill="#9E968F">GRID-6</text>
    <text x="1395" y="865" fill="#9E968F">GRID-7</text>
  </g>

  <!-- Formal Title Block Stamp in Bottom Corner -->
  <g transform="translate(1180, 710)">
    <rect width="380" height="150" fill="#181513" stroke="rgba(196, 139, 94, 0.4)" stroke-width="1.5" />
    <line x1="0" y1="40" x2="380" y2="40" stroke="rgba(196, 139, 94, 0.2)" />
    <line x1="0" y1="80" x2="380" y2="80" stroke="rgba(196, 139, 94, 0.2)" />
    <line x1="0" y1="115" x2="380" y2="115" stroke="rgba(196, 139, 94, 0.2)" />
    <line x1="190" y1="40" x2="190" y2="150" stroke="rgba(196, 139, 94, 0.2)" />

    <text x="16" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#F5F3EF" letter-spacing="1.5">STRATUM VDC &amp; MEP CONSULTING</text>
    <text x="16" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9E968F">PROJECT: MIXED-USE TOWER</text>
    <text x="206" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9E968F">DISCIPLINE: MEP-COORDINATION</text>
    <text x="16" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9E968F">DWG NO: STR-MEP-CO-101</text>
    <text x="206" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9E968F">SCALE: 1:50 @ A1</text>
    <text x="16" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C48B5E">STATUS: FOR CONSTRUCTION (GFC)</text>
    <text x="206" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C48B5E">CODE: NBC 2016 // IS CODES</text>
  </g>
</svg>