<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <!-- Crisp Monochrome Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
    </pattern>

    <!-- Hatching Patterns for CAD Ductwork -->
    <pattern id="hatchWhite" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    </pattern>
    <pattern id="hatchSilver" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Pitch Black Background -->
  <rect width="1600" height="900" fill="#000000" />
  <rect width="1600" height="900" fill="url(#majorGrid)" />

  <!-- Architectural Building Structural Columns & Grid (IS 456 Structural Grid) -->
  <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="6,4">
    <!-- Gridlines X (1 to 8) -->
    <line x1="200" y1="60" x2="200" y2="840" />
    <line x1="400" y1="60" x2="400" y2="840" />
    <line x1="600" y1="60" x2="600" y2="840" />
    <line x1="800" y1="60" x2="800" y2="840" />
    <line x1="1000" y1="60" x2="1000" y2="840" />
    <line x1="1200" y1="60" x2="1200" y2="840" />
    <line x1="1400" y1="60" x2="1400" y2="840" />

    <!-- Gridlines Y (A to E) -->
    <line x1="100" y1="160" x2="1500" y2="160" />
    <line x1="100" y1="340" x2="1500" y2="340" />
    <line x1="100" y1="520" x2="1500" y2="520" />
    <line x1="100" y1="700" x2="1500" y2="700" />
  </g>

  <!-- Concrete Structural Columns with Cross Bracing -->
  <g fill="#121214" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5">
    <rect x="185" y="145" width="30" height="30" />
    <line x1="185" y1="145" x2="215" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="385" y="145" width="30" height="30" />
    <line x1="385" y1="145" x2="415" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="585" y="145" width="30" height="30" />
    <line x1="585" y1="145" x2="615" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="785" y="145" width="30" height="30" />
    <line x1="785" y1="145" x2="815" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="985" y="145" width="30" height="30" />
    <line x1="985" y1="145" x2="1015" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="1185" y="145" width="30" height="30" />
    <line x1="1185" y1="145" x2="1215" y2="175" stroke="rgba(255,255,255,0.25)" />
    <rect x="1385" y="145" width="30" height="30" />
    <line x1="1385" y1="145" x2="1415" y2="175" stroke="rgba(255,255,255,0.25)" />

    <rect x="185" y="325" width="30" height="30" />
    <rect x="385" y="325" width="30" height="30" />
    <rect x="585" y="325" width="30" height="30" />
    <rect x="785" y="325" width="30" height="30" />
    <rect x="985" y="325" width="30" height="30" />
    <rect x="1185" y="325" width="30" height="30" />
    <rect x="1385" y="325" width="30" height="30" />

    <rect x="185" y="505" width="30" height="30" />
    <rect x="385" y="505" width="30" height="30" />
    <rect x="585" y="505" width="30" height="30" />
    <rect x="785" y="505" width="30" height="30" />
    <rect x="985" y="505" width="30" height="30" />
    <rect x="1185" y="505" width="30" height="30" />
    <rect x="1385" y="505" width="30" height="30" />

    <rect x="185" y="685" width="30" height="30" />
    <rect x="385" y="685" width="30" height="30" />
    <rect x="585" y="685" width="30" height="30" />
    <rect x="785" y="685" width="30" height="30" />
    <rect x="985" y="685" width="30" height="30" />
    <rect x="1185" y="685" width="30" height="30" />
    <rect x="1385" y="685" width="30" height="30" />
  </g>

  <!-- Grid Identifiers (Top & Left Axis Circles) -->
  <g font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">
    <circle cx="200" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="200" y="40">1</text>
    <circle cx="400" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="400" y="40">2</text>
    <circle cx="600" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="600" y="40">3</text>
    <circle cx="800" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="800" y="40">4</text>
    <circle cx="1000" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="1000" y="40">5</text>
    <circle cx="1200" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="1200" y="40">6</text>
    <circle cx="1400" cy="40" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="1400" y="40">7</text>

    <circle cx="70" cy="160" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="70" y="160">A</text>
    <circle cx="70" cy="340" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="70" y="340">B</text>
    <circle cx="70" cy="520" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="70" y="520">C</text>
    <circle cx="70" cy="700" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="70" y="700">D</text>
  </g>

  <!-- ==========================================
       MEP CO-ORDINATION LAYERS (High Contrast Monochrome CAD)
       ========================================== -->

  <!-- HVAC Supply Air Duct Main (Solid White Outer, Hatch Fill) -->
  <g stroke="#FFFFFF" stroke-width="2" fill="url(#hatchWhite)">
    <!-- Primary Supply Trunk Route -->
    <path d="M 120 220 L 750 220 L 750 380 L 1480 380 L 1480 430 L 700 430 L 700 270 L 120 270 Z" />
    <!-- Secondary Distribution Branches -->
    <path d="M 320 220 L 320 120 L 370 120 L 370 220 Z" />
    <path d="M 540 270 L 540 370 L 590 370 L 590 270 Z" />
    <path d="M 960 380 L 960 260 L 1000 260 L 1000 380 Z" />
    <path d="M 1180 430 L 1180 560 L 1220 560 L 1220 430 Z" />
  </g>

  <!-- Diffusers / Grilles (VAV Supply Terminals) -->
  <g fill="#000000" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="330" y="90" width="30" height="30" />
    <line x1="330" y1="90" x2="360" y2="120" />
    <line x1="330" y1="120" x2="360" y2="90" />

    <rect x="550" y="370" width="30" height="30" />
    <line x1="550" y1="370" x2="580" y2="400" />
    <line x1="550" y1="400" x2="580" y2="370" />

    <rect x="965" y="230" width="30" height="30" />
    <line x1="965" y1="230" x2="995" y2="260" />
    <line x1="965" y1="260" x2="995" y2="230" />

    <rect x="1185" y="560" width="30" height="30" />
    <line x1="1185" y1="560" x2="1215" y2="590" />
    <line x1="1185" y1="590" x2="1215" y2="560" />
  </g>

  <!-- HVAC Return Air Duct (Silver Outline, Cross-Hatch) -->
  <g stroke="#D4D4D8" stroke-width="1.8" fill="url(#hatchSilver)">
    <path d="M 120 480 L 640 480 L 640 600 L 1320 600 L 1320 635 L 610 635 L 610 515 L 120 515 Z" />
    <path d="M 420 480 L 420 400 L 450 400 L 450 480 Z" />
    <path d="M 850 635 L 850 720 L 880 720 L 880 635 Z" />
  </g>

  <!-- Electrical Cable Tray 600mm (Double Dashed Silver Lines) -->
  <g stroke="#E4E4E7" stroke-width="2.5" stroke-dasharray="10,4">
    <path d="M 120 300 L 1520 300" />
    <path d="M 120 315 L 1520 315" />
    <path d="M 720 315 L 720 780" />
    <path d="M 735 315 L 735 780" />
  </g>

  <!-- Fire Protection Sprinkler Main 100mm DIA (Dot-Dash White Line) -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="14,4,3,4">
    <path d="M 150 180 L 1450 180" />
    <path d="M 150 540 L 1450 540" />
    <path d="M 150 720 L 1450 720" />
  </g>

  <!-- Pendant Sprinkler Heads (Crisp White Dots with Rays) -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="1">
    <circle cx="300" cy="180" r="5" />
    <circle cx="500" cy="180" r="5" />
    <circle cx="700" cy="180" r="5" />
    <circle cx="900" cy="180" r="5" />
    <circle cx="1100" cy="180" r="5" />
    <circle cx="1300" cy="180" r="5" />

    <circle cx="300" cy="540" r="5" />
    <circle cx="500" cy="540" r="5" />
    <circle cx="700" cy="540" r="5" />
    <circle cx="900" cy="540" r="5" />
    <circle cx="1100" cy="540" r="5" />
    <circle cx="1300" cy="540" r="5" />
  </g>

  <!-- Plumbing / Drainage Pipe 150mm DIA (Crisp Light Gray Solid Line) -->
  <g stroke="#A1A1AA" stroke-width="2" stroke-linecap="round">
    <path d="M 180 760 L 600 760 L 680 680 L 1200 680 L 1260 740 L 1450 740" />
    <!-- Floor Cleanouts / Traps -->
    <circle cx="600" cy="760" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="1200" cy="680" r="6" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Technical Elevation Markers & CAD Dimensions -->
  <g font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">
    <!-- Callout 1: HVAC Duct Size -->
    <rect x="420" y="240" width="130" height="20" fill="#000000" stroke="#FFFFFF" stroke-width="1" />
    <text x="425" y="254">SAD 1200x500 B.O.D+3150</text>

    <!-- Callout 2: Return Duct -->
    <rect x="220" y="490" width="125" height="20" fill="#000000" stroke="#FFFFFF" stroke-width="1" />
    <text x="225" y="504">RAD 900x450 B.O.D+3200</text>

    <!-- Callout 3: Electrical Tray -->
    <rect x="830" y="303" width="115" height="18" fill="#000000" stroke="#D4D4D8" stroke-width="1" />
    <text x="835" y="316" fill="#D4D4D8">600x100mm PERF TRAY</text>

    <!-- Callout 4: Fire Main -->
    <rect x="340" y="168" width="100" height="18" fill="#000000" stroke="#FFFFFF" stroke-width="1" />
    <text x="345" y="181">DN100 SPR MAIN</text>

    <!-- Callout 5: Drainage Slope -->
    <rect x="800" y="668" width="110" height="18" fill="#000000" stroke="#A1A1AA" stroke-width="1" />
    <text x="805" y="681" fill="#A1A1AA">DN150 SOIL S=1:60</text>
  </g>

  <!-- Dimension Arrows (CAD Style with 45-degree ticks) -->
  <g stroke="#FFFFFF" stroke-width="1">
    <!-- Horizontal Span 1 to 2 -->
    <line x1="200" y1="800" x2="400" y2="800" />
    <line x1="195" y1="805" x2="205" y2="795" stroke-width="1.5" />
    <line x1="395" y1="805" x2="405" y2="795" stroke-width="1.5" />
    <text x="278" y="794" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#FFFFFF">8,400 mm</text>

    <!-- Horizontal Span 2 to 3 -->
    <line x1="400" y1="800" x2="600" y2="800" />
    <line x1="395" y1="805" x2="405" y2="795" stroke-width="1.5" />
    <line x1="595" y1="805" x2="605" y2="795" stroke-width="1.5" />
    <text x="478" y="794" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#FFFFFF">8,400 mm</text>
  </g>

  <!-- CAD Drawing Title Block Stamp (Bottom Right ISO 7200 Minimalist) -->
  <g transform="translate(1180, 710)">
    <rect width="380" height="150" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="0" y1="38" x2="380" y2="38" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="76" x2="380" y2="76" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="114" x2="380" y2="114" stroke="#FFFFFF" stroke-width="1" />
    <line x1="230" y1="0" x2="230" y2="150" stroke="#FFFFFF" stroke-width="1" />

    <text x="14" y="24" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">PROJECT: COMMERCE TOWER 04</text>
    <text x="242" y="24" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#A1A1AA">REV: 03</text>

    <text x="14" y="60" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">DRAWING: MEP COMPOSITE LEVEL 04</text>
    <text x="242" y="60" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#A1A1AA">SCALE: 1:50 @ A1</text>

    <text x="14" y="98" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">CONSULTANT: STRATUM VDC &amp; MEP</text>
    <text x="242" y="98" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#A1A1AA">LOD: 400 FAB</text>

    <text x="14" y="136" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">DWG NO: STR-MEP-L04-CO-001</text>
    <text x="242" y="136" font-family="'Source Sans Pro', 'Source Sans 3', sans-serif" font-size="11" fill="#FFFFFF">STATUS: APPROVED</text>
  </g>
</svg>